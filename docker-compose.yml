version: '3.8'

services:
  # ============================================================
  # POSTGRESQL DATABASE
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: fiis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-fiis_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-fiis_pass}
      POSTGRES_DB: ${PGDATABASE:-fiis_monitor}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - fiis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-fiis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # REDIS CACHE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: fiis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - fiis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # API NODE.JS
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      PGUSER: ${PGUSER:-fiis_user}
      PGPASSWORD: ${PGPASSWORD:-fiis_pass}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-fiis_monitor}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    networks:
      - fiis-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # NGINX REVERSE PROXY (OPCIONAL)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: fiis-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - fiis-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  fiis-network:
    driver: bridge